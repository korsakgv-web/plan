<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Обмеры">
  <title>Инженерные обмеры — Bosch GLM 50C</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; display: flex; flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: calc(env(safe-area-inset-top, 10px) + 6px) 10px 8px;
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      z-index: 10;
    }
    .room-tabs {
      display: flex; gap: 5px; overflow-x: auto; max-width: 42%;
      scrollbar-width: none;
    }
    .room-tab {
      background: #0f172a; color: var(--muted);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 9px; font-size: 12px; font-weight: 600; white-space: nowrap;
      cursor: pointer;
    }
    .room-tab.active {
      background: var(--accent); color: #0f172a; border-color: var(--accent);
    }
    .top-actions { display: flex; gap: 5px; align-items: center; }
    button {
      background: #334155; color: var(--text);
      border: 1px solid #475569; border-radius: 6px;
      padding: 7px 10px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: 0.15s; white-space: nowrap;
    }
    button:active { transform: scale(0.96); }
    button.primary { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    button.success { background: var(--success); color: #0f172a; border-color: var(--success); }
    button.warn { background: var(--warn); color: #0f172a; border-color: var(--warn); }
    button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    button.ble-connected { background: #16a34a; color: #fff; border-color: #22c55e; }

    #status-bar {
      background: rgba(30, 41, 59, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px; font-size: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      z-index: 9;
    }
    .badge {
      padding: 2px 7px; border-radius: 4px; font-weight: 600; font-size: 11px;
    }
    .badge-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-ok { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-err { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid #ef4444; }

    #alert-banner {
      display: none;
      background: rgba(153, 27, 27, 0.95);
      border-bottom: 1px solid #ef4444;
      color: #fecaca;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      z-index: 9;
    }

    #laser-toast {
      position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
      background: rgba(22, 163, 74, 0.95); color: #fff;
      padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 700;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      display: none; z-index: 30; pointer-events: none;
    }

    #canvas-wrap {
      flex: 1; position: relative; overflow: hidden;
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }

    #hint-box {
      position: absolute; top: 10px; left: 12px; right: 12px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 12px; color: #e2e8f0;
      pointer-events: none; backdrop-filter: blur(4px);
    }

    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 8px 12px calc(env(safe-area-inset-bottom, 12px) + 6px);
      display: flex; flex-direction: column; gap: 8px;
      z-index: 10;
    }
    .toolbar-row {
      display: flex; justify-content: space-between; gap: 6px;
    }
    .toolbar-row button { flex: 1; text-align: center; padding: 9px 6px; }

    #modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 16px;
    }
    .modal {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; width: 100%; max-width: 350px;
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .modal h3 { margin: 0; font-size: 16px; }
    .modal p { margin: 0; font-size: 13px; color: var(--muted); }
    .modal-error {
      display: none; background: rgba(239, 68, 68, 0.18);
      border: 1px solid #ef4444; color: #fca5a5;
      padding: 8px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
    }
    .modal input {
      width: 100%; padding: 10px 12px; font-size: 18px; font-weight: bold;
      background: #0f172a; border: 1px solid var(--accent); color: #fff;
      border-radius: 8px; text-align: center;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
    .modal-actions button { flex: 1; padding: 10px; }
  </style>
</head>
<body>

<header>
  <div class="room-tabs" id="room-tabs"></div>
  <div class="top-actions">
    <button id="btn-ble" onclick="connectBoschBLE()">📡 GLM 50C</button>
    <button onclick="resetView()" title="Центрировать вид">⌖ Вид</button>
    <button class="success" onclick="exportDXF()">DXF</button>
  </div>
</header>

<div id="status-bar">
  <div id="geom-status">Начните рисовать контур</div>
  <div id="error-metric">Макс. невязка: 0 мм</div>
</div>

<div id="alert-banner"></div>

<div id="canvas-wrap">
  <canvas id="cad-canvas"></canvas>
  <div id="hint-box">Тапайте по экрану, чтобы наметить углы первого помещения по внутреннему контуру.</div>
  <div id="laser-toast">🎯 GLM 50C: 0 мм</div>
</div>

<footer>
  <div class="toolbar-row" id="mode-buttons">
    <button id="btn-draw" class="primary" onclick="setMode('draw')">1. Контур</button>
    <button id="btn-measure" onclick="setMode('measure')">2. Размеры</button>
    <button id="btn-solve" class="warn" onclick="solveCurrentRoom(true)">3. Пересчёт</button>
    <button id="btn-attach" onclick="startAttachRoom()">+ Комната</button>
  </div>
  <div class="toolbar-row">
    <button onclick="undoPoint()">↶ Шаг назад</button>
    <button onclick="closePolygon()" id="btn-close-poly">Замкнуть контур</button>
    <button class="danger" onclick="clearAllProject()">Сброс</button>
  </div>
</footer>

<!-- Модальное окно ввода -->
<div id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Размер в миллиметрах</h3>
    <p id="modal-desc">Введите значение вручную или нажмите кнопку на Bosch GLM 50C:</p>
    <div id="modal-error" class="modal-error"></div>
    <input type="text" id="modal-input" inputmode="decimal" placeholder="Например: 4250 или 4.250">
    <div class="modal-actions">
      <button onclick="closeModal()">Отмена</button>
      <button class="primary" id="modal-ok">Сохранить</button>
    </div>
  </div>
</div>

<script>
const TOLERANCE_MM = 10.0; // Допуск на невязку +-10 мм

// Константы протокола Bosch GLM 50 C / 100 C / 120 C
const BOSCH_SERVICE_UUID = "02a6c0d0-0451-4000-b000-fb3210111989";
const BOSCH_CHAR_UUID    = "02a6c0d1-0451-4000-b000-fb3210111989";
// Команда включения Auto-Sync (дальномер сам присылает пакет при каждом нажатии кнопки замера)
const BOSCH_AUTOSYNC_CMD = new Uint8Array([0xC0, 0x55, 0x02, 0x01, 0x00, 0x1A]);

let bleDevice = null;
let bleChar = null;

let state = {
  rooms: [
    {
      id: 1,
      name: "Пом. 1",
      pts: [],
      sketchAngles: [],
      closed: false,
      walls: {},
      diags: {}
    }
  ],
  activeRoomIdx: 0,
  mode: 'draw',
  selectedVertex: null,
  recommendedDiag: null,
  activeTargetEdge: null, // { i, j, isWall } — текущий прицел для автоматического приема с дальномера
  maxAbsError: 0,
  badEdges: {}
};

let cam = {
  x: window.innerWidth / 2,
  y: window.innerHeight / 2,
  scale: 0.08
};

const canvas = document.getElementById('cad-canvas');
const ctx = canvas.getContext('2d');

function loadState() {
  const saved = localStorage.getItem('cad_survey_state_v3');
  if (saved) {
    try {
      state = JSON.parse(saved);
      if (!state.badEdges) state.badEdges = {};
    } catch (e) { console.error(e); }
  }
}
function saveState() {
  localStorage.setItem('cad_survey_state_v3', JSON.stringify(state));
}

function activeRoom() {
  return state.rooms[state.activeRoomIdx];
}

function edgeKey(i, j) {
  return i < j ? `${i}-${j}` : `${j}-${i}`;
}

function dist(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

function screenToWorld(sx, sy) {
  return { x: (sx - cam.x) / cam.scale, y: (sy - cam.y) / cam.scale };
}
function worldToScreen(wx, wy) {
  return { x: wx * cam.scale + cam.x, y: wy * cam.scale + cam.y };
}

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  render();
}
window.addEventListener('resize', resizeCanvas);

// =================== МОДУЛЬ BLUETOOTH BOSCH GLM 50 C ===================

async function connectBoschBLE() {
  if (!navigator.bluetooth) {
    alert(
      "Стандартный Safari на iOS блокирует прямой Web Bluetooth API.\n\n" +
      "Чтобы подключить Bosch GLM 50C напрямую к этой странице на iPhone/iPad:\n" +
      "1. Установите бесплатный браузер «Bluefy – Web BLE Browser» из App Store.\n" +
      "2. Откройте эту ссылку в Bluefy и нажмите «📡 GLM 50C»."
    );
    return;
  }

  try {
    if (bleDevice && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
      updateBleButton(false);
      return;
    }

    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [
        { services: [BOSCH_SERVICE_UUID] },
        { namePrefix: "Bosch" },
        { namePrefix: "GLM" }
      ],
      optionalServices: [BOSCH_SERVICE_UUID]
    });

    bleDevice.addEventListener('gattserverdisconnected', () => {
      updateBleButton(false);
      showLaserToast("📡 GLM 50C отключен", true);
    });

    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(BOSCH_SERVICE_UUID);
    bleChar = await service.getCharacteristic(BOSCH_CHAR_UUID);

    await bleChar.startNotifications();
    bleChar.addEventListener('characteristicvaluechanged', handleBoschPacket);

    // Включаем режим Auto-Sync на Bosch GLM 50C
    await bleChar.writeValue(BOSCH_AUTOSYNC_CMD);

    updateBleButton(true, bleDevice.name || "GLM 50C");
    showLaserToast("✅ Bosch GLM 50C подключен!");

    // Если контур замкнут, сразу активируем прицел на первую неизмеренную стену
    if (activeRoom().closed) {
      setMode('measure');
      autoSelectNextTarget();
      render();
    }
  } catch (err) {
    console.error("BLE Error:", err);
    if (err.name !== 'NotFoundError') {
      alert("Ошибка подключения к Bosch GLM 50C: " + err.message);
    }
  }
}

function updateBleButton(connected, name = "GLM 50C") {
  const btn = document.getElementById('btn-ble');
  if (connected) {
    btn.className = "ble-connected";
    btn.textContent = "🟢 " + name;
  } else {
    btn.className = "";
    btn.textContent = "📡 GLM 50C";
  }
}

/**
 * Разбор бинарного пакета от Bosch GLM 50 C (протокол MT-Connectivity)
 * При выстреле лазером в режиме Auto-Sync приходит пакет >= 11 байт (0xC0 0x55 ...),
 * где байты [7..10] содержат Float32 (Little-Endian) — измеренную дистанцию в метрах.
 */
function handleBoschPacket(event) {
  const dv = event.target.value;
  if (!dv || dv.byteLength < 11) return;

  // Читаем Float32 с 7-го байта (индекс 7, Little-Endian = true)
  const meters = dv.getFloat32(7, true);
  if (isNaN(meters) || meters <= 0.03 || meters > 100.0) return;

  const mm = Math.round(meters * 1000);
  applyLaserMeasurement(mm);
}

/**
 * Применение размера, прилетевшего с лазерного дальномера Bosch GLM 50C
 */
function applyLaserMeasurement(mm) {
  showLaserToast(`🎯 GLM 50C: ${mm} мм`);

  // 1. Если открыто модальное окно — вставляем значение прямо в него и автоматически нажимаем ОК
  const modalOverlay = document.getElementById('modal-overlay');
  if (modalOverlay.style.display === 'flex') {
    const inp = document.getElementById('modal-input');
    inp.value = mm;
    document.getElementById('modal-ok').click();
    return;
  }

  // 2. Если модальное окно закрыто — работаем в потоковом режиме (Hands-Free) по прицелу activeTargetEdge
  const r = activeRoom();
  if (!r.closed) return;

  if (!state.activeTargetEdge) {
    autoSelectNextTarget();
  }
  const target = state.activeTargetEdge;
  if (!target) return;

  const { i, j, isWall } = target;
  const errMsg = validateMeasurement(r, i, j, mm);
  if (errMsg) {
    // Если замер физически невозможен — открываем модальное окно с ошибкой
    if (isWall) promptWallLength(r, i, j, mm);
    else promptDiagLength(r, i, j, mm);
    showModalError(errMsg);
    return;
  }

  const k = edgeKey(i, j);
  if (isWall) {
    r.walls[k] = mm;
    solveCurrentRoom(Object.keys(r.walls).length === 1);
  } else {
    r.diags[k] = mm;
    solveCurrentRoom(false);
  }

  // Переводим прицел на следующую неизмеренную стену или рекомендуемую диагональ
  autoSelectNextTarget();
  updateStatus();
  render();
}

function showLaserToast(text, isWarn = false) {
  const toast = document.getElementById('laser-toast');
  toast.textContent = text;
  toast.style.background = isWarn ? 'rgba(239, 68, 68, 0.95)' : 'rgba(22, 163, 74, 0.95)';
  toast.style.display = 'block';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 2600);
}

// Автоматический выбор следующей неизмеренной стены или рекомендуемой диагонали для прицела дальномера
function autoSelectNextTarget() {
  const r = activeRoom();
  const N = r.pts.length;
  if (!r.closed || N < 3) {
    state.activeTargetEdge = null;
    return;
  }

  // Ищем первую неизмеренную стену по порядку
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    if (r.walls[edgeKey(i, j)] === undefined) {
      state.activeTargetEdge = { i, j, isWall: true };
      return;
    }
  }

  // Если все стены измерены, берем рекомендуемую диагональ
  const rec = findBestMissingDiagonal(r);
  if (rec) {
    state.activeTargetEdge = { i: rec[0], j: rec[1], isWall: false };
    return;
  }

  state.activeTargetEdge = null;
}

// Умный парсер ввода: понимает и миллиметры ("4250"), и метры с точкой/запятой от HID-клавиатур ("4.253" -> 4253 мм)
function parseDistanceInput(rawStr) {
  const clean = rawStr.trim().replace(',', '.');
  if (!clean) return NaN;
  const num = parseFloat(clean);
  if (isNaN(num) || num <= 0) return NaN;
  // Если введено число с десятичной точкой и меньше 50 (например, 4.253 м), переводим в мм
  if (clean.includes('.') && num < 50) {
    return Math.round(num * 1000);
  }
  return Math.round(num);
}

// =================== ВКЛАДКИ И РЕЖИМЫ ===================

function renderTabs() {
  const container = document.getElementById('room-tabs');
  container.innerHTML = '';
  state.rooms.forEach((r, idx) => {
    const btn = document.createElement('div');
    btn.className = 'room-tab' + (idx === state.activeRoomIdx ? ' active' : '');
    btn.textContent = r.name;
    btn.onclick = () => {
      state.activeRoomIdx = idx;
      state.selectedVertex = null;
      setMode(activeRoom().closed ? 'measure' : 'draw');
      renderTabs();
      evaluateRoomErrors(activeRoom());
      updateStatus();
      render();
    };
    container.appendChild(btn);
  });
}

function setMode(m) {
  state.mode = m;
  state.selectedVertex = null;
  document.getElementById('btn-draw').className = (m === 'draw') ? 'primary' : '';
  document.getElementById('btn-measure').className = (m === 'measure') ? 'primary' : '';
  const hint = document.getElementById('hint-box');

  const r = activeRoom();
  if (m === 'draw') {
    hint.textContent = r.closed
      ? "Контур замкнут. Перейдите в «2. Размеры» для промеров с GLM 50C или вручную."
      : "Тапайте по экрану для добавления углов. Для замыкания нажмите «Замкнуть контур» или тапните в точку 1.";
  } else if (m === 'measure') {
    autoSelectNextTarget();
    hint.textContent = "🎯 Стреляйте дальномером в подсвеченную желтым цель, или тапните на любую стену / два угла вручную.";
  } else if (m === 'select_wall_for_room') {
    hint.textContent = "Тапните на общую стену текущего помещения, за которой находится следующая комната.";
  }
  updateStatus();
  render();
}

function undoPoint() {
  const r = activeRoom();
  if (!r.closed && r.pts.length > 0) {
    const last = r.pts[r.pts.length - 1];
    if (last.fixed) {
      alert("Точка зафиксирована от смежной комнаты.");
      return;
    }
    r.pts.pop();
    saveState();
    updateStatus();
    render();
  } else if (r.closed) {
    r.closed = false;
    setMode('draw');
    saveState();
    render();
  }
}

function closePolygon() {
  const r = activeRoom();
  if (r.pts.length < 3) {
    alert("Для замыкания помещения нужно минимум 3 угла.");
    return;
  }
  r.closed = true;
  saveSketchAngles(r);
  setMode('measure');
  saveState();
  updateStatus();
  render();
}

function saveSketchAngles(r) {
  const N = r.pts.length;
  r.sketchAngles = [];
  for (let i = 0; i < N; i++) {
    const prev = r.pts[(i - 1 + N) % N];
    const curr = r.pts[i];
    const next = r.pts[(i + 1) % N];
    const a1 = Math.atan2(curr.y - prev.y, curr.x - prev.x);
    const a2 = Math.atan2(next.y - curr.y, next.x - curr.x);
    let turn = a2 - a1;
    while (turn <= -Math.PI) turn += 2 * Math.PI;
    while (turn > Math.PI) turn -= 2 * Math.PI;
    r.sketchAngles.push(turn);
  }
}

function clearAllProject() {
  if (!confirm("Очистить весь проект и начать заново?")) return;
  localStorage.removeItem('cad_survey_state_v3');
  state = {
    rooms: [{ id: 1, name: "Пом. 1", pts: [], sketchAngles: [], closed: false, walls: {}, diags: {} }],
    activeRoomIdx: 0,
    mode: 'draw',
    selectedVertex: null,
    recommendedDiag: null,
    activeTargetEdge: null,
    maxAbsError: 0,
    badEdges: {}
  };
  resetView();
  renderTabs();
  setMode('draw');
}

function resetView() {
  const rect = canvas.parentElement.getBoundingClientRect();
  let allPts = [];
  state.rooms.forEach(r => allPts.push(...r.pts));
  if (allPts.length === 0) {
    cam.x = rect.width / 2;
    cam.y = rect.height / 2;
    cam.scale = 0.08;
  } else {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    allPts.forEach(p => {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    });
    const w = Math.max(maxX - minX, 2000);
    const h = Math.max(maxY - minY, 2000);
    cam.scale = Math.min((rect.width * 0.72) / w, (rect.height * 0.72) / h);
    cam.x = rect.width / 2 - ((minX + maxX) / 2) * cam.scale;
    cam.y = rect.height / 2 - ((minY + maxY) / 2) * cam.scale;
  }
  render();
}

// =================== ГЕОМЕТРИЧЕСКИЙ ВАЛИДАТОР ===================

function validateMeasurement(r, u, v, newL) {
  const N = r.pts.length;
  const targetKey = edgeKey(u, v);

  const known = {};
  Object.keys(r.walls).forEach(k => known[k] = r.walls[k]);
  Object.keys(r.diags).forEach(k => known[k] = r.diags[k]);
  known[targetKey] = newL;

  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      for (let m = j + 1; m < N; m++) {
        const d1 = known[edgeKey(i, j)];
        const d2 = known[edgeKey(j, m)];
        const d3 = known[edgeKey(i, m)];
        if (d1 !== undefined && d2 !== undefined && d3 !== undefined) {
          const maxSide = Math.max(d1, d2, d3);
          const sumOther = d1 + d2 + d3 - maxSide;
          if (maxSide >= sumOther + TOLERANCE_MM) {
            return `Невозможный треугольник углов (${i+1}-${j+1}-${m+1}): сторона ${maxSide} мм больше или равна сумме двух других (${sumOther} мм)! Проверьте замер.`;
          }
        }
      }
    }
  }

  let allWallsKnown = true;
  let wallLengths = [];
  for (let i = 0; i < N; i++) {
    const wL = known[edgeKey(i, (i + 1) % N)];
    if (wL === undefined) { allWallsKnown = false; break; }
    wallLengths.push({ idx1: i + 1, idx2: ((i + 1) % N) + 1, L: wL });
  }
  if (allWallsKnown) {
    const maxWall = wallLengths.reduce((a, b) => a.L > b.L ? a : b);
    const sumOthers = wallLengths.reduce((acc, w) => acc + w.L, 0) - maxWall.L;
    if (maxWall.L >= sumOthers + TOLERANCE_MM) {
      return `Ошибка периметра: стена ${maxWall.idx1}-${maxWall.idx2} (${maxWall.L} мм) длиннее суммы всех остальных стен (${sumOthers} мм)!`;
    }
  }

  const isWall = (Math.abs(u - v) === 1) || (u === 0 && v === N - 1) || (v === 0 && u === N - 1);
  if (!isWall) {
    let path1Complete = true, sum1 = 0;
    for (let curr = u; curr !== v; curr = (curr + 1) % N) {
      const next = (curr + 1) % N;
      const w = known[edgeKey(curr, next)];
      if (w === undefined) { path1Complete = false; break; }
      sum1 += w;
    }
    if (path1Complete && newL >= sum1 + TOLERANCE_MM) {
      return `Диагональ ${u+1}-${v+1} (${newL} мм) длиннее суммы обходящих её стен (${sum1} мм)!`;
    }

    let path2Complete = true, sum2 = 0;
    for (let curr = v; curr !== u; curr = (curr + 1) % N) {
      const next = (curr + 1) % N;
      const w = known[edgeKey(curr, next)];
      if (w === undefined) { path2Complete = false; break; }
      sum2 += w;
    }
    if (path2Complete && newL >= sum2 + TOLERANCE_MM) {
      return `Диагональ ${u+1}-${v+1} (${newL} мм) длиннее суммы обходящих её стен (${sum2} мм)!`;
    }
  }

  return null;
}

// =================== МАТЕМАТИЧЕСКИЙ РЕШАТЕЛЬ ===================

function solveCurrentRoom(centerAfter = false) {
  const r = activeRoom();
  const N = r.pts.length;
  if (!r.closed || N < 3) return;

  const measuredWallKeys = Object.keys(r.walls);
  const measuredDiagKeys = Object.keys(r.diags);
  if (measuredWallKeys.length === 0 && measuredDiagKeys.length === 0) return;

  const hasFixed = r.pts.some(p => p.fixed);

  if (!hasFixed) {
    let sumScale = 0, cntScale = 0;
    measuredWallKeys.forEach(k => {
      const [i, j] = k.split('-').map(Number);
      const d = dist(r.pts[i], r.pts[j]);
      if (d > 1) { sumScale += r.walls[k] / d; cntScale++; }
    });
    measuredDiagKeys.forEach(k => {
      const [i, j] = k.split('-').map(Number);
      const d = dist(r.pts[i], r.pts[j]);
      if (d > 1) { sumScale += r.diags[k] / d; cntScale++; }
    });

    if (cntScale > 0) {
      const ratio = sumScale / cntScale;
      if (Math.abs(ratio - 1.0) > 0.05) {
        const cx = r.pts[0].x, cy = r.pts[0].y;
        for (let i = 0; i < N; i++) {
          r.pts[i].x = cx + (r.pts[i].x - cx) * ratio;
          r.pts[i].y = cy + (r.pts[i].y - cy) * ratio;
        }
      }
    }
  }

  const constraints = [];
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    const k = edgeKey(i, j);
    if (r.walls[k] !== undefined) {
      constraints.push({ i, j, L: r.walls[k], stiff: 1.5, isWall: true, key: k });
    } else {
      constraints.push({ i, j, L: dist(r.pts[i], r.pts[j]), stiff: 0.02, isWall: false, key: k });
    }
  }

  measuredDiagKeys.forEach(k => {
    const [i, j] = k.split('-').map(Number);
    if (i < N && j < N) {
      constraints.push({ i, j, L: r.diags[k], stiff: 1.0, isWall: false, key: k });
    }
  });

  const reqDiags = Math.max(0, N - 3);
  if (measuredDiagKeys.length < reqDiags) {
    for (let i = 0; i < N; i++) {
      const prev = (i - 1 + N) % N;
      const next = (i + 1) % N;
      const k = edgeKey(prev, next);
      if (r.diags[k] === undefined && N > 3) {
        const L1 = r.walls[edgeKey(prev, i)] || dist(r.pts[prev], r.pts[i]);
        const L2 = r.walls[edgeKey(i, next)] || dist(r.pts[i], r.pts[next]);
        const turn = (r.sketchAngles && r.sketchAngles[i] !== undefined) ? r.sketchAngles[i] : Math.PI / 2;
        const interiorAngle = Math.PI - Math.abs(turn);
        const softDiag = Math.sqrt(Math.max(100, L1*L1 + L2*L2 - 2*L1*L2*Math.cos(interiorAngle)));
        constraints.push({ i: prev, j: next, L: softDiag, stiff: 0.04, isWall: false, key: k, soft: true });
      }
    }
  }

  let anchor0 = -1, anchor1 = -1, dirAngle = 0;
  if (!hasFixed) {
    anchor0 = 0;
    anchor1 = 1;
    dirAngle = Math.atan2(r.pts[1].y - r.pts[0].y, r.pts[1].x - r.pts[0].x);
    const snapAngles = [0, Math.PI/2, Math.PI, -Math.PI, -Math.PI/2];
    for (let sa of snapAngles) {
      if (Math.abs(dirAngle - sa) < 0.22) { dirAngle = sa; break; }
    }
  }
  const p0Orig = anchor0 !== -1 ? { x: r.pts[0].x, y: r.pts[0].y } : null;

  const totalIters = 5000;
  for (let iter = 0; iter < totalIters; iter++) {
    const damp = 0.45 * (1 - iter / (totalIters * 1.05));

    for (let c of constraints) {
      const pA = r.pts[c.i];
      const pB = r.pts[c.j];
      const vx = pB.x - pA.x;
      const vy = pB.y - pA.y;
      const curD = Math.hypot(vx, vy) || 1e-6;
      const err = curD - c.L;

      const ux = vx / curD;
      const uy = vy / curD;

      const fixA = pA.fixed || c.i === anchor0;
      const fixB = pB.fixed || c.j === anchor0;

      const corr = err * c.stiff * damp;

      if (!fixA && !fixB) {
        pA.x += ux * corr * 0.5;
        pA.y += uy * corr * 0.5;
        pB.x -= ux * corr * 0.5;
        pB.y -= uy * corr * 0.5;
      } else if (fixA && !fixB) {
        pB.x -= ux * corr;
        pB.y -= uy * corr;
      } else if (!fixA && fixB) {
        pA.x += ux * corr;
        pA.y += uy * corr;
      }
    }

    if (anchor1 === 1 && !r.pts[1].fixed) {
      const d01 = dist(r.pts[0], r.pts[1]);
      r.pts[1].x = r.pts[0].x + Math.cos(dirAngle) * d01;
      r.pts[1].y = r.pts[0].y + Math.sin(dirAngle) * d01;
    }
    if (p0Orig) {
      r.pts[0].x = p0Orig.x;
      r.pts[0].y = p0Orig.y;
    }
  }

  evaluateRoomErrors(r);
  saveState();
  if (centerAfter) resetView();
  updateStatus();
  render();
}

function evaluateRoomErrors(r) {
  state.badEdges = {};
  state.maxAbsError = 0;
  const N = r.pts.length;
  if (!r.closed || N < 3) return;

  const checkEdge = (i, j, targetL, labelPrefix) => {
    const k = edgeKey(i, j);
    const actualL = dist(r.pts[i], r.pts[j]);
    const delta = actualL - targetL;
    const absD = Math.abs(delta);
    if (absD > state.maxAbsError) state.maxAbsError = absD;
    if (absD > TOLERANCE_MM) {
      state.badEdges[k] = {
        delta: delta,
        actual: Math.round(actualL),
        target: targetL,
        name: `${labelPrefix} ${i+1}-${j+1}`
      };
    }
  };

  Object.keys(r.walls).forEach(k => {
    const [i, j] = k.split('-').map(Number);
    if (i < N && j < N) checkEdge(i, j, r.walls[k], "Стена");
  });

  Object.keys(r.diags).forEach(k => {
    const [i, j] = k.split('-').map(Number);
    if (i < N && j < N) checkEdge(i, j, r.diags[k], "Диаг.");
  });
}

// =================== СТАТУС И ИНДИКАЦИЯ ===================

function updateStatus() {
  const r = activeRoom();
  const statusEl = document.getElementById('geom-status');
  const errEl = document.getElementById('error-metric');
  const banner = document.getElementById('alert-banner');
  state.recommendedDiag = null;

  const N = r.pts.length;
  if (!r.closed) {
    statusEl.innerHTML = `Углов: <b>${N}</b> (не замкнут)`;
    errEl.textContent = `Макс. невязка: —`;
    banner.style.display = 'none';
    return;
  }

  let measuredWalls = 0;
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    if (r.walls[edgeKey(i, j)] !== undefined) measuredWalls++;
  }

  const requiredDiags = Math.max(0, N - 3);
  const measuredDiags = Object.keys(r.diags).length;

  if (measuredDiags < requiredDiags) {
    state.recommendedDiag = findBestMissingDiagonal(r);
  }

  if (measuredWalls < N) {
    statusEl.innerHTML = `<span class="badge badge-warn">Стены: ${measuredWalls}/${N}</span> Диаг: ${measuredDiags}/${requiredDiags}`;
  } else if (measuredDiags < requiredDiags) {
    statusEl.innerHTML = `<span class="badge badge-warn">Нужно ещё диаг: ${requiredDiags - measuredDiags}</span> (${measuredDiags}/${requiredDiags})`;
  } else {
    statusEl.innerHTML = `<span class="badge badge-ok">Стены: ${N}/${N}, Диаг: ${measuredDiags}</span>`;
  }

  const maxErr = state.maxAbsError;
  if (maxErr > TOLERANCE_MM) {
    errEl.innerHTML = `<span class="badge badge-err">Невязка: ${maxErr.toFixed(1)} мм (> 10 мм!)</span>`;
    const badList = Object.values(state.badEdges)
      .map(b => `${b.name} (${b.delta > 0 ? '+' : ''}${Math.round(b.delta)} мм)`)
      .join(', ');
    banner.style.display = 'block';
    banner.textContent = `⚠️ Превышен допуск ±10 мм! Конфликт размеров: ${badList}. Перемерьте выделенные красным линии.`;
  } else {
    errEl.innerHTML = `Макс. невязка: <b>${maxErr.toFixed(1)} мм</b> (допуск ±10)`;
    banner.style.display = 'none';
  }
}

function findBestMissingDiagonal(r) {
  const N = r.pts.length;
  if (N < 4) return null;

  let bestPair = null, bestScore = -Infinity;
  for (let i = 0; i < N; i++) {
    for (let j = i + 2; j < N; j++) {
      if (i === 0 && j === N - 1) continue;
      const key = edgeKey(i, j);
      if (r.diags[key] !== undefined) continue;

      const mid = { x: (r.pts[i].x + r.pts[j].x) / 2, y: (r.pts[i].y + r.pts[j].y) / 2 };
      if (!pointInPolygon(mid, r.pts)) continue;

      let degI = 0, degJ = 0;
      Object.keys(r.diags).forEach(k => {
        const [a, b] = k.split('-').map(Number);
        if (a === i || b === i) degI++;
        if (a === j || b === j) degJ++;
      });

      const d = dist(r.pts[i], r.pts[j]);
      const score = -(degI + degJ) * 10000 + d * 0.1;
      if (score > bestScore) {
        bestScore = score;
        bestPair = [i, j];
      }
    }
  }
  return bestPair;
}

function pointInPolygon(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    const intersect = ((yi > pt.y) !== (yj > pt.y)) &&
                      (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi + 1e-9) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// =================== ПРИВЯЗКА ВТОРОЙ КОМНАТЫ ===================

function startAttachRoom() {
  const r = activeRoom();
  if (!r.closed) {
    alert("Сначала замкните и обмерьте текущее помещение.");
    return;
  }
  setMode('select_wall_for_room');
}

function attachNewRoomOnWall(wallIdxA, wallIdxB) {
  openModal(
    "Толщина стены / перегородки",
    "Введите предварительную толщину стены между помещениями (мм):",
    "120",
    (valStr) => {
      const thickness = parseDistanceInput(valStr);
      if (isNaN(thickness) || thickness < 0) return true;

      const r = activeRoom();
      const pA = r.pts[wallIdxA];
      const pB = r.pts[wallIdxB];

      const vx = pB.x - pA.x, vy = pB.y - pA.y;
      const len = Math.hypot(vx, vy) || 1;
      let nx = -vy / len, ny = vx / len;

      const midX = (pA.x + pB.x) / 2 + nx * 10;
      const midY = (pA.y + pB.y) / 2 + ny * 10;
      if (pointInPolygon({ x: midX, y: midY }, r.pts)) {
        nx = -nx; ny = -ny;
      }

      const newP1 = { x: pB.x + nx * thickness, y: pB.y + ny * thickness, fixed: true };
      const newP2 = { x: pA.x + nx * thickness, y: pA.y + ny * thickness, fixed: true };

      const newRoomId = state.rooms.length + 1;
      const newRoom = {
        id: newRoomId,
        name: `Пом. ${newRoomId}`,
        pts: [newP1, newP2],
        sketchAngles: [],
        closed: false,
        walls: { "0-1": Math.round(len) },
        diags: {}
      };

      state.rooms.push(newRoom);
      state.activeRoomIdx = state.rooms.length - 1;
      saveState();
      renderTabs();
      setMode('draw');
      render();
      return true;
    }
  );
}

// =================== МОДАЛЬНОЕ ОКНО ===================

let modalCallback = null;
function openModal(title, desc, defaultValue, onSave) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-desc').textContent = desc;
  const errBox = document.getElementById('modal-error');
  errBox.style.display = 'none';
  errBox.textContent = '';

  const inp = document.getElementById('modal-input');
  inp.value = defaultValue !== undefined ? defaultValue : '';
  document.getElementById('modal-overlay').style.display = 'flex';
  modalCallback = onSave;
  setTimeout(() => { inp.focus(); inp.select(); }, 50);
}

function showModalError(msg) {
  const errBox = document.getElementById('modal-error');
  errBox.textContent = msg;
  errBox.style.display = 'block';
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
  modalCallback = null;
}

document.getElementById('modal-ok').onclick = () => {
  const val = document.getElementById('modal-input').value;
  if (modalCallback) {
    const shouldClose = modalCallback(val);
    if (shouldClose !== false) closeModal();
  } else {
    closeModal();
  }
};

document.getElementById('modal-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('modal-ok').click();
});

// =================== КАСАНИЯ И ВВОД РАЗМЕРОВ ===================

let pointers = new Map();
let lastPinchDist = null;
let lastPanMid = null;
let pointerDownPos = null;
let isDragging = false;

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1) {
    pointerDownPos = { x: e.clientX, y: e.clientY };
    isDragging = false;
  } else if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    lastPanMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1 && pointerDownPos) {
    if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 8) isDragging = true;
    if (isDragging) {
      cam.x += e.clientX - prev.x;
      cam.y += e.clientY - prev.y;
      render();
    }
  } else if (pointers.size === 2) {
    isDragging = true;
    const pts = Array.from(pointers.values());
    const curDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const curMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };

    if (lastPinchDist && lastPinchDist > 10) {
      const rect = canvas.getBoundingClientRect();
      const zoomCenter = { x: curMid.x - rect.left, y: curMid.y - rect.top };
      const factor = curDist / lastPinchDist;
      const newScale = Math.min(Math.max(cam.scale * factor, 0.005), 1.5);
      cam.x = zoomCenter.x - (zoomCenter.x - cam.x) * (newScale / cam.scale);
      cam.y = zoomCenter.y - (zoomCenter.y - cam.y) * (newScale / cam.scale);
      cam.scale = newScale;
    }
    if (lastPanMid) {
      cam.x += curMid.x - lastPanMid.x;
      cam.y += curMid.y - lastPanMid.y;
    }
    lastPinchDist = curDist;
    lastPanMid = curMid;
    render();
  }
});

canvas.addEventListener('pointerup', (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) { lastPinchDist = null; lastPanMid = null; }
  if (!isDragging && pointerDownPos) {
    const rect = canvas.getBoundingClientRect();
    handleTap(e.clientX - rect.left, e.clientY - rect.top);
  }
  if (pointers.size === 0) pointerDownPos = null;
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  const newScale = Math.min(Math.max(cam.scale * factor, 0.005), 1.5);
  cam.x = sx - (sx - cam.x) * (newScale / cam.scale);
  cam.y = sy - (sy - cam.y) * (newScale / cam.scale);
  cam.scale = newScale;
  render();
}, { passive: false });

function handleTap(sx, sy) {
  const r = activeRoom();
  const wPt = screenToWorld(sx, sy);

  if (state.mode === 'draw') {
    if (r.closed) return;
    if (r.pts.length >= 3) {
      const p0Screen = worldToScreen(r.pts[0].x, r.pts[0].y);
      if (Math.hypot(sx - p0Screen.x, sy - p0Screen.y) < 26) {
        closePolygon();
        return;
      }
    }
    let newX = Math.round(wPt.x / 10) * 10;
    let newY = Math.round(wPt.y / 10) * 10;
    if (r.pts.length > 0) {
      const prev = r.pts[r.pts.length - 1];
      if (Math.abs(newX - prev.x) < 180) newX = prev.x;
      if (Math.abs(newY - prev.y) < 180) newY = prev.y;
    }
    r.pts.push({ x: newX, y: newY, fixed: false });
    saveState();
    updateStatus();
    render();
    return;
  }

  if (state.mode === 'select_wall_for_room') {
    const hitWall = findHitWall(r, sx, sy);
    if (hitWall) attachNewRoomOnWall(hitWall[0], hitWall[1]);
    return;
  }

  if (state.mode === 'measure') {
    const hitV = findHitVertex(r, sx, sy);
    if (hitV !== -1) {
      if (state.selectedVertex === null) {
        state.selectedVertex = hitV;
        render();
      } else if (state.selectedVertex === hitV) {
        state.selectedVertex = null;
        render();
      } else {
        const vA = state.selectedVertex;
        const vB = hitV;
        state.selectedVertex = null;
        const N = r.pts.length;
        const isAdjacent = (Math.abs(vA - vB) === 1) || (vA === 0 && vB === N - 1) || (vB === 0 && vA === N - 1);
        const curDist = Math.round(dist(r.pts[vA], r.pts[vB]));

        state.activeTargetEdge = { i: vA, j: vB, isWall: isAdjacent };
        if (isAdjacent) {
          promptWallLength(r, vA, vB, curDist);
        } else {
          promptDiagLength(r, vA, vB, curDist);
        }
        render();
      }
      return;
    }

    const hitWall = findHitWall(r, sx, sy);
    if (hitWall) {
      state.selectedVertex = null;
      const [i, j] = hitWall;
      state.activeTargetEdge = { i, j, isWall: true };
      const curDist = Math.round(dist(r.pts[i], r.pts[j]));
      promptWallLength(r, i, j, curDist);
      render();
      return;
    }

    const hitDiag = findHitDiag(r, sx, sy);
    if (hitDiag) {
      state.selectedVertex = null;
      const [i, j] = hitDiag;
      state.activeTargetEdge = { i, j, isWall: false };
      const curDist = Math.round(dist(r.pts[i], r.pts[j]));
      promptDiagLength(r, i, j, curDist);
      render();
      return;
    }

    state.selectedVertex = null;
    render();
  }
}

function promptWallLength(r, i, j, curDist) {
  const k = edgeKey(i, j);
  const existing = r.walls[k] !== undefined ? r.walls[k] : curDist;
  openModal(
    `Стена №${i + 1} — №${j + 1}`,
    "Введите длину (мм) или нажмите кнопку на Bosch GLM 50C:",
    existing,
    (valStr) => {
      if (valStr.trim() === '') {
        delete r.walls[k];
        solveCurrentRoom(false);
        autoSelectNextTarget();
        return true;
      }
      const v = parseDistanceInput(valStr);
      if (isNaN(v) || v <= 0) {
        showModalError("Введите положительное число в миллиметрах.");
        return false;
      }
      const errMsg = validateMeasurement(r, i, j, v);
      if (errMsg) {
        showModalError(errMsg);
        return false;
      }
      r.walls[k] = v;
      solveCurrentRoom(Object.keys(r.walls).length === 1);
      autoSelectNextTarget();
      return true;
    }
  );
}

function promptDiagLength(r, i, j, curDist) {
  const k = edgeKey(i, j);
  const existing = r.diags[k] !== undefined ? r.diags[k] : curDist;
  openModal(
    `Диагональ №${i + 1} — №${j + 1}`,
    "Введите длину диагонали (мм) или стреляйте из GLM 50C:",
    existing,
    (valStr) => {
      if (valStr.trim() === '') {
        delete r.diags[k];
        solveCurrentRoom(false);
        autoSelectNextTarget();
        return true;
      }
      const v = parseDistanceInput(valStr);
      if (isNaN(v) || v <= 0) {
        showModalError("Введите положительное число в миллиметрах.");
        return false;
      }
      const errMsg = validateMeasurement(r, i, j, v);
      if (errMsg) {
        showModalError(errMsg);
        return false;
      }
      r.diags[k] = v;
      solveCurrentRoom(false);
      autoSelectNextTarget();
      return true;
    }
  );
}

function findHitVertex(r, sx, sy) {
  for (let i = 0; i < r.pts.length; i++) {
    const sp = worldToScreen(r.pts[i].x, r.pts[i].y);
    if (Math.hypot(sx - sp.x, sy - sp.y) < 24) return i;
  }
  return -1;
}

function findHitWall(r, sx, sy) {
  const N = r.pts.length;
  const count = r.closed ? N : N - 1;
  let best = null, minD = 22;
  for (let i = 0; i < count; i++) {
    const j = (i + 1) % N;
    const p1 = worldToScreen(r.pts[i].x, r.pts[i].y);
    const p2 = worldToScreen(r.pts[j].x, r.pts[j].y);
    const d = pointToSegmentDist(sx, sy, p1.x, p1.y, p2.x, p2.y);
    if (d < minD) { minD = d; best = [i, j]; }
  }
  return best;
}

function findHitDiag(r, sx, sy) {
  let best = null, minD = 20;
  Object.keys(r.diags).forEach(k => {
    const [i, j] = k.split('-').map(Number);
    if (i < r.pts.length && j < r.pts.length) {
      const p1 = worldToScreen(r.pts[i].x, r.pts[i].y);
      const p2 = worldToScreen(r.pts[j].x, r.pts[j].y);
      const d = pointToSegmentDist(sx, sy, p1.x, p1.y, p2.x, p2.y);
      if (d < minD) { minD = d; best = [i, j]; }
    }
  });
  return best;
}

function pointToSegmentDist(px, py, x1, y1, x2, y2) {
  const vx = x2 - x1, vy = y2 - y1;
  const lenSq = vx * vx + vy * vy;
  if (lenSq === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * vx + (py - y1) * vy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * vx), py - (y1 + t * vy));
}

// =================== ОТРИСОВКА С ПРИЦЕЛОМ ДАЛЬНОМЕРА ===================

function formatEdgeLabel(prefix, enteredVal, actualVal) {
  const diff = Math.round(actualVal - enteredVal);
  if (Math.abs(diff) === 0) {
    return `${prefix}${enteredVal}`;
  }
  const sign = diff > 0 ? '+' : '';
  return `${prefix}${enteredVal} (${sign}${diff} мм)`;
}

function render() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);

  drawGrid(W, H);

  state.rooms.forEach((room, idx) => {
    if (idx !== state.activeRoomIdx) drawRoom(room, false);
  });
  drawRoom(activeRoom(), true);
}

function drawGrid(W, H) {
  const stepMM = 1000;
  const stepPx = stepMM * cam.scale;
  if (stepPx < 15) return;

  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const startX = cam.x % stepPx;
  const startY = cam.y % stepPx;

  ctx.beginPath();
  for (let x = startX; x < W; x += stepPx) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = startY; y < H; y += stepPx) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

function drawRoom(r, isActive) {
  const N = r.pts.length;
  if (N === 0) return;

  if (r.closed && N >= 3) {
    ctx.beginPath();
    r.pts.forEach((p, idx) => {
      const sp = worldToScreen(p.x, p.y);
      if (idx === 0) ctx.moveTo(sp.x, sp.y);
      else ctx.lineTo(sp.x, sp.y);
    });
    ctx.closePath();
    ctx.fillStyle = isActive ? 'rgba(56, 189, 248, 0.08)' : 'rgba(148, 163, 184, 0.04)';
    ctx.fill();
  }

  // Диагонали
  if (isActive) {
    Object.keys(r.diags).forEach(k => {
      const [i, j] = k.split('-').map(Number);
      if (i >= N || j >= N) return;
      const p1 = worldToScreen(r.pts[i].x, r.pts[i].y);
      const p2 = worldToScreen(r.pts[j].x, r.pts[j].y);
      const actualD = dist(r.pts[i], r.pts[j]);
      const isBad = state.badEdges[k] !== undefined;

      ctx.save();
      ctx.setLineDash([6, 4]);
      ctx.strokeStyle = isBad ? '#ef4444' : '#a855f7';
      ctx.lineWidth = isBad ? 2.8 : 1.8;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      ctx.restore();

      const lbl = formatEdgeLabel('Д: ', r.diags[k], actualD);
      drawLabel(
        (p1.x + p2.x) / 2, (p1.y + p2.y) / 2,
        lbl,
        isBad ? '#fecaca' : '#d8b4fe',
        isBad ? '#991b1b' : '#3b0764'
      );
    });

    if (state.recommendedDiag) {
      const [ri, rj] = state.recommendedDiag;
      const p1 = worldToScreen(r.pts[ri].x, r.pts[ri].y);
      const p2 = worldToScreen(r.pts[rj].x, r.pts[rj].y);
      const isTargeted = state.activeTargetEdge && !state.activeTargetEdge.isWall &&
                         edgeKey(state.activeTargetEdge.i, state.activeTargetEdge.j) === edgeKey(ri, rj);

      ctx.save();
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = isTargeted ? 3.2 : 2;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      ctx.restore();

      drawLabel(
        (p1.x + p2.x) / 2, (p1.y + p2.y) / 2,
        isTargeted ? `🎯 Замерьте диаг. ${ri+1}-${rj+1}` : `Замерьте диаг. ${ri+1}-${rj+1}`,
        '#fef08a', '#78350f'
      );
    }
  }

  // Стены
  const edgeCount = r.closed ? N : N - 1;
  for (let i = 0; i < edgeCount; i++) {
    const j = (i + 1) % N;
    const p1 = worldToScreen(r.pts[i].x, r.pts[i].y);
    const p2 = worldToScreen(r.pts[j].x, r.pts[j].y);
    const k = edgeKey(i, j);
    const hasMeasured = r.walls[k] !== undefined;
    const actualD = dist(r.pts[i], r.pts[j]);
    const isBad = isActive && state.badEdges[k] !== undefined;
    const isTargeted = isActive && state.mode === 'measure' && state.activeTargetEdge &&
                       state.activeTargetEdge.isWall && edgeKey(state.activeTargetEdge.i, state.activeTargetEdge.j) === k;

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    if (!isActive) {
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
    } else if (isBad) {
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 4;
    } else if (isTargeted) {
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 4.5;
    } else {
      ctx.strokeStyle = hasMeasured ? '#22c55e' : '#38bdf8';
      ctx.lineWidth = hasMeasured ? 3.5 : 2.5;
    }
    ctx.stroke();

    const mx = (p1.x + p2.x) / 2;
    const my = (p1.y + p2.y) / 2;
    const prefix = isTargeted ? '🎯 ' : '';
    const valText = hasMeasured
      ? formatEdgeLabel(prefix, r.walls[k], actualD)
      : `${prefix}~${Math.round(actualD)}`;

    if (isActive) {
      drawLabel(
        mx, my, valText,
        isBad ? '#fecaca' : (isTargeted ? '#fef08a' : (hasMeasured ? '#bbf7d0' : '#bae6fd')),
        isBad ? '#991b1b' : (isTargeted ? '#78350f' : (hasMeasured ? '#14532d' : '#0c4a6e'))
      );
    } else if (hasMeasured) {
      drawLabel(mx, my, `${Math.round(actualD)}`, '#94a3b8', '#1e293b');
    }
  }

  if (r.closed && N >= 3) {
    const areaM2 = computePolygonAreaM2(r.pts);
    const c = computeCentroid(r.pts);
    const sc = worldToScreen(c.x, c.y);
    ctx.fillStyle = isActive ? '#f8fafc' : '#64748b';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${r.name}: ${areaM2.toFixed(2)} м²`, sc.x, sc.y);
  }

  if (isActive) {
    r.pts.forEach((p, idx) => {
      const sp = worldToScreen(p.x, p.y);
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, state.selectedVertex === idx ? 10 : 7, 0, Math.PI * 2);
      ctx.fillStyle = state.selectedVertex === idx ? '#f59e0b' : (p.fixed ? '#ef4444' : '#0f172a');
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = state.selectedVertex === idx ? '#fff' : '#38bdf8';
      ctx.stroke();

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`${idx + 1}`, sp.x + 10, sp.y - 8);
    });
  }
}

function drawLabel(x, y, text, textColor, bgColor) {
  ctx.font = '600 11px sans-serif';
  const w = ctx.measureText(text).width + 10;
  const h = 18;
  ctx.fillStyle = bgColor;
  ctx.beginPath();
  ctx.roundRect(x - w / 2, y - h / 2, w, h, 4);
  ctx.fill();
  ctx.fillStyle = textColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function computePolygonAreaM2(pts) {
  let area = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    area += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y);
  }
  return Math.abs(area / 2) / 1e6;
}

function computeCentroid(pts) {
  let x = 0, y = 0;
  pts.forEach(p => { x += p.x; y += p.y; });
  return { x: x / pts.length, y: y / pts.length };
}

// =================== ЭКСПОРТ DXF ===================

function exportDXF() {
  let dxf = [];
  const add = (code, val) => { dxf.push(code, val); };

  add(0, "SECTION");
  add(2, "ENTITIES");

  state.rooms.forEach(r => {
    const N = r.pts.length;
    if (N < 2) return;

    const count = r.closed ? N : N - 1;
    for (let i = 0; i < count; i++) {
      const j = (i + 1) % N;
      const p1 = r.pts[i], p2 = r.pts[j];
      add(0, "LINE");
      add(8, "WALLS");
      add(62, 7);
      add(10, p1.x.toFixed(2));
      add(20, (-p1.y).toFixed(2));
      add(30, "0.0");
      add(11, p2.x.toFixed(2));
      add(21, (-p2.y).toFixed(2));
      add(31, "0.0");

      const mx = (p1.x + p2.x) / 2;
      const my = (-p1.y - p2.y) / 2;
      const len = Math.round(dist(p1, p2));
      add(0, "TEXT");
      add(8, "DIMENSIONS");
      add(62, 3);
      add(10, mx.toFixed(2));
      add(20, my.toFixed(2));
      add(30, "0.0");
      add(40, "120.0");
      add(1, `${len}`);
    }

    Object.keys(r.diags).forEach(k => {
      const [i, j] = k.split('-').map(Number);
      if (i < N && j < N) {
        const p1 = r.pts[i], p2 = r.pts[j];
        add(0, "LINE");
        add(8, "DIAGONALS");
        add(62, 6);
        add(10, p1.x.toFixed(2));
        add(20, (-p1.y).toFixed(2));
        add(30, "0.0");
        add(11, p2.x.toFixed(2));
        add(21, (-p2.y).toFixed(2));
        add(31, "0.0");
      }
    });

    if (r.closed && N >= 3) {
      const c = computeCentroid(r.pts);
      const area = computePolygonAreaM2(r.pts).toFixed(2);
      add(0, "TEXT");
      add(8, "ROOM_INFO");
      add(62, 5);
      add(10, c.x.toFixed(2));
      add(20, (-c.y).toFixed(2));
      add(30, "0.0");
      add(40, "180.0");
      add(1, `Room ${r.id} (${area} m2)`);
    }
  });

  add(0, "ENDSEC");
  add(0, "EOF");

  const blob = new Blob([dxf.join("\r\n")], { type: "application/dxf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `obmer_${new Date().toISOString().slice(0,10)}.dxf`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

loadState();
renderTabs();
resizeCanvas();
evaluateRoomErrors(activeRoom());
updateStatus();
</script>
